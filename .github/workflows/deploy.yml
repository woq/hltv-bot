name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: rsync to VPS and restart
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 154.83.86.212 >> ~/.ssh/known_hosts 2>/dev/null
          HOST=root@154.83.86.212
          ssh "$HOST" 'mkdir -p /opt/hltv-bot/data'
          rsync -az \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude 'data/session.json' \
            --exclude 'data/chats.json' \
            --exclude 'data/settings.json' \
            ./ "$HOST:/opt/hltv-bot/"
          ssh "$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          export PATH="/root/.local/bin:/usr/local/bin:$PATH"
          export DEBIAN_FRONTEND=noninteractive
          if ! command -v uv >/dev/null; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="/root/.local/bin:$PATH"
          fi
          cd /opt/hltv-bot
          test -f .env || cp .env.example .env
          test -f data/session.json || cp data/session.example.json data/session.json
          uv sync
          install -m 644 deploy/hltv-bot.service /etc/systemd/system/hltv-bot.service
          systemctl daemon-reload
          systemctl enable hltv-bot
          systemctl restart hltv-bot
          systemctl is-active hltv-bot
          REMOTE
